<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">映像・音声・スナップショットの処理パイプライン</title>
  <desc id="desc">親機から届いた H264 と PCMU が、depacketize・ffmpeg・SRTP を経て iPhone に届くまでの処理段。</desc>
  <style>
    text { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f2328; }
    .t { font-size: 13.5px; font-weight: 600; }
    .s { font-size: 11.5px; fill: #59636e; }
    .m { font-family: ui-monospace, Menlo, monospace; font-size: 11px; fill: #59636e; }
    .h { font-size: 12.5px; font-weight: 700; fill: #59636e; }
    .bx { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
    .blue { fill: #ddf4ff; stroke: #54aeff; }
    .green { fill: #dafbe1; stroke: #4ac26b; }
    .yellow { fill: #fff8c5; stroke: #d4a72c; }
    .ar { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .ah { fill: #59636e; }
    .sep { stroke: #d1d9e0; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .s, .m, .h { fill: #9198a1; }
      .bx { fill: #151b23; stroke: #656c76; }
      .blue { fill: #121d2f; stroke: #1f6feb; }
      .green { fill: #12261e; stroke: #2ea043; }
      .yellow { fill: #272115; stroke: #9e6a03; }
      .ar { stroke: #9198a1; }
      .ah { fill: #9198a1; }
      .sep { stroke: #3d444d; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>

  <!-- ===== Video ===== -->
  <text class="h" x="20" y="36">映像</text>
  <rect class="bx green" x="20" y="50" width="110" height="78" rx="8"/>
  <text class="t" x="34" y="74">親機</text>
  <text class="s" x="34" y="94">H264 RTP</text>
  <text class="m" x="34" y="113">pt101 / FU-A</text>

  <rect class="bx" x="160" y="50" width="150" height="78" rx="8"/>
  <text class="t" x="174" y="74">videoTrack</text>
  <text class="s" x="174" y="94">node-datachannel</text>
  <text class="s" x="174" y="113">SRTP 復号済み RTP</text>

  <rect class="bx" x="340" y="50" width="150" height="78" rx="8"/>
  <text class="t" x="354" y="74">H264Depay</text>
  <text class="s" x="354" y="94">FU-A を再構成し</text>
  <text class="s" x="354" y="113">Annex-B NAL に</text>

  <rect class="bx green" x="520" y="50" width="150" height="78" rx="8"/>
  <text class="t" x="534" y="74">DoorphoneSource</text>
  <text class="s" x="534" y="94">SPS / PPS を保持</text>
  <text class="s" x="534" y="113">IDR から配信開始</text>

  <rect class="bx blue" x="700" y="50" width="150" height="78" rx="8"/>
  <text class="t" x="714" y="74">ffmpeg（映像）</text>
  <text class="m" x="714" y="94">-c:v copy</text>
  <text class="s" x="714" y="113">→ SRTP で送信</text>

  <rect class="bx blue" x="880" y="50" width="100" height="78" rx="8"/>
  <text class="t" x="894" y="74">iPhone</text>
  <text class="s" x="894" y="94">H264</text>
  <text class="s" x="894" y="113">そのまま</text>

  <line class="ar" x1="130" y1="89" x2="156" y2="89" marker-end="url(#a)"/>
  <line class="ar" x1="310" y1="89" x2="336" y2="89" marker-end="url(#a)"/>
  <line class="ar" x1="490" y1="89" x2="516" y2="89" marker-end="url(#a)"/>
  <line class="ar" x1="670" y1="89" x2="696" y2="89" marker-end="url(#a)"/>
  <line class="ar" x1="850" y1="89" x2="876" y2="89" marker-end="url(#a)"/>

  <!-- ===== Snapshot ===== -->
  <text class="h" x="20" y="176">スナップショット</text>
  <rect class="bx yellow" x="520" y="160" width="150" height="78" rx="8"/>
  <text class="t" x="534" y="184">キーフレーム保存</text>
  <text class="s" x="534" y="204">SPS + PPS + IDR</text>
  <text class="s" x="534" y="223">欠けた IDR は除外</text>

  <rect class="bx blue" x="700" y="160" width="150" height="78" rx="8"/>
  <text class="t" x="714" y="184">ffmpeg（静止画）</text>
  <text class="m" x="714" y="204">-c:v mjpeg</text>
  <text class="s" x="714" y="223">5 秒キャッシュ</text>

  <rect class="bx blue" x="880" y="160" width="100" height="78" rx="8"/>
  <text class="t" x="894" y="184">Home</text>
  <text class="s" x="894" y="204">タイル表示</text>
  <text class="s" x="894" y="223">JPEG</text>

  <line class="ar" x1="595" y1="128" x2="595" y2="156" marker-end="url(#a)"/>
  <line class="ar" x1="670" y1="199" x2="696" y2="199" marker-end="url(#a)"/>
  <line class="ar" x1="850" y1="199" x2="876" y2="199" marker-end="url(#a)"/>

  <line class="sep" x1="20" y1="262" x2="980" y2="262"/>

  <!-- ===== Audio ===== -->
  <text class="h" x="20" y="292">音声</text>
  <rect class="bx green" x="20" y="306" width="110" height="78" rx="8"/>
  <text class="t" x="34" y="330">親機</text>
  <text class="s" x="34" y="350">PCMU RTP</text>
  <text class="s" x="34" y="369">8 kHz</text>

  <rect class="bx" x="160" y="306" width="150" height="78" rx="8"/>
  <text class="t" x="174" y="330">audioTrack</text>
  <text class="s" x="174" y="350">RTP ヘッダを除去</text>
  <text class="s" x="174" y="369">ペイロードのみ</text>

  <rect class="bx" x="340" y="306" width="150" height="78" rx="8"/>
  <text class="t" x="354" y="330">AudioPacer</text>
  <text class="s" x="354" y="350">20 ms ごとに 160 B</text>
  <text class="s" x="354" y="369">不足分は無音で補う</text>

  <rect class="bx blue" x="520" y="306" width="150" height="78" rx="8"/>
  <text class="t" x="534" y="330">ffmpeg（音声）</text>
  <text class="m" x="534" y="350">libopus 16 kHz</text>
  <text class="s" x="534" y="369">→ 平文 RTP</text>

  <rect class="bx blue" x="700" y="306" width="150" height="78" rx="8"/>
  <text class="t" x="714" y="330">AudioProxy</text>
  <text class="s" x="714" y="350">RTP TS を書き換え</text>
  <text class="s" x="714" y="369">SRTP 暗号化</text>

  <rect class="bx blue" x="880" y="306" width="100" height="78" rx="8"/>
  <text class="t" x="894" y="330">iPhone</text>
  <text class="s" x="894" y="350">Opus</text>
  <text class="s" x="894" y="369">16 kHz</text>

  <line class="ar" x1="130" y1="345" x2="156" y2="345" marker-end="url(#a)"/>
  <line class="ar" x1="310" y1="345" x2="336" y2="345" marker-end="url(#a)"/>
  <line class="ar" x1="490" y1="345" x2="516" y2="345" marker-end="url(#a)"/>
  <line class="ar" x1="670" y1="345" x2="696" y2="345" marker-end="url(#a)"/>
  <line class="ar" x1="850" y1="345" x2="876" y2="345" marker-end="url(#a)"/>

  <text class="s" x="20" y="414">※ 親機へは 20 ms ごとに無音の PCMU を送り続ける（アプリと同じ sendrecv の offer にするため）。</text>
  <text class="s" x="20" y="434">※ RTP タイムスタンプは Opus 標準の 48 kHz 刻み（+960）ではなく、HomeKit が期待する 16 kHz 刻み（+320）に書き換える。</text>
</svg>
