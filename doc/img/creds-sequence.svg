<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 414" role="img" aria-labelledby="title desc">
  <title id="title">クレデンシャル更新のシーケンス</title>
  <desc id="desc">ペアリング後、クライアント証明書だけで AWS 一時クレデンシャルを取り続ける流れ。</desc>
  <style>
    text { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f2328; }
    .t { font-size: 14px; font-weight: 600; }
    .s { font-size: 11.5px; fill: #59636e; }
    .msg { font-size: 12.5px; }
    .m { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
    .bx { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
    .blue { fill: #ddf4ff; stroke: #54aeff; }
    .green { fill: #dafbe1; stroke: #4ac26b; }
    .yellow { fill: #fff8c5; stroke: #d4a72c; }
    .red { fill: #ffebe9; stroke: #ff8182; }
    .purple { fill: #fbefff; stroke: #c297ff; }
    .life { stroke: #8c959f; stroke-width: 1; stroke-dasharray: 4 4; }
    .ar { stroke: #59636e; stroke-width: 1.4; fill: none; }
    .ar.media { stroke: #1a7f37; stroke-width: 2.2; }
    .ar.ret { stroke-dasharray: 5 3; }
    .ah { fill: #59636e; }
    .ahg { fill: #1a7f37; }
    .note { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1; }
    .phase { fill: #f6f8fa; }
    .ph { font-size: 11.5px; font-weight: 600; fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .s, .ph { fill: #9198a1; }
      .bx { fill: #151b23; stroke: #656c76; }
      .blue { fill: #121d2f; stroke: #1f6feb; }
      .green { fill: #12261e; stroke: #2ea043; }
      .yellow { fill: #272115; stroke: #9e6a03; }
      .red { fill: #2c1517; stroke: #da3633; }
      .purple { fill: #211830; stroke: #8957e5; }
      .life { stroke: #656c76; }
      .ar { stroke: #9198a1; }
      .ar.media { stroke: #3fb950; }
      .ah { fill: #9198a1; }
      .ahg { fill: #3fb950; }
      .note { fill: #272115; stroke: #9e6a03; }
      .phase { fill: #151b23; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ahg"/>
    </marker>
  </defs>

  <line class="life" x1="110" y1="64" x2="110" y2="408"/>
  <line class="life" x1="420" y1="64" x2="420" y2="408"/>
  <line class="life" x1="730" y1="64" x2="730" y2="408"/>
  <rect class="bx green" x="15" y="12" width="190" height="52" rx="8"/>
  <text class="t" x="110" y="34" text-anchor="middle">CredsRefresher</text>
  <text class="m s" x="110" y="53" text-anchor="middle">creds-refresher.js</text>
  <rect class="bx " x="325" y="12" width="190" height="52" rx="8"/>
  <text class="t" x="420" y="34" text-anchor="middle">AWS IoT Core</text>
  <text class="s" x="420" y="53" text-anchor="middle">MQTT ブローカ</text>
  <rect class="bx green" x="635" y="12" width="190" height="52" rx="8"/>
  <text class="t" x="730" y="34" text-anchor="middle">親機</text>
  <text class="s" x="730" y="53" text-anchor="middle">VL-X70AH</text>
  <line class="ar" x1="110" y1="96" x2="416" y2="96" marker-end="url(#a)"/>
  <text class="msg" x="265" y="90" text-anchor="middle">MQTT 接続（mTLS: cert.pem / privkey.pem）</text>
  <line class="ar" x1="110" y1="130" x2="416" y2="130" marker-end="url(#a)"/>
  <text class="msg m" x="265" y="124" text-anchor="middle">SUBSCRIBE doorphone/comm/&lt;unitId&gt;</text>
  <line class="ar" x1="110" y1="164" x2="416" y2="164" marker-end="url(#a)"/>
  <text class="msg m" x="265" y="158" text-anchor="middle">PUBLISH {command: GET_SIGNALING_CHANNEL}</text>
  <line class="ar" x1="420" y1="198" x2="726" y2="198" marker-end="url(#a)"/>
  <text class="msg" x="575" y="192" text-anchor="middle">同じトピックを購読している親機へ配送</text>
  <line class="ar ret" x1="730" y1="232" x2="424" y2="232" marker-end="url(#a)"/>
  <text class="msg m" x="575" y="226" text-anchor="middle">NOTIFY_KVS_CREDENTIAL{AccessKeyId, …, channelName}</text>
  <line class="ar ret" x1="420" y1="266" x2="114" y2="266" marker-end="url(#a)"/>
  <text class="msg" x="265" y="260" text-anchor="middle">配送（to が自分宛てのものだけ処理）</text>
  <rect class="note" x="50" y="287" width="430" height="40" rx="4"/>
  <text class="s" x="265" y="301" text-anchor="middle">kvs_creds.json に保存（有効期限 約 10 分）</text>
  <text class="s" x="265" y="317" text-anchor="middle">期限 2 分前と 60 秒ごとに再要求</text>
  <rect class="note" x="50" y="339" width="430" height="40" rx="4"/>
  <text class="s" x="265" y="353" text-anchor="middle">{error: NOT_REGISTERED} や 3 回連続の無応答 →</text>
  <text class="s" x="265" y="369" text-anchor="middle">親機側で登録解除されたと判断し証明書を退避</text>
</svg>
