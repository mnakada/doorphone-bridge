<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" role="img" aria-labelledby="title desc">
  <title id="title">解析の全体の流れ</title>
  <desc id="desc">APK の入手から HomeKit 化までの 8 段階。上段が準備と観測、下段が再実装。</desc>
  <style>
    text { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f2328; }
    .t { font-size: 14px; font-weight: 600; }
    .n { font-size: 12px; font-weight: 700; fill: #59636e; }
    .s { font-size: 12px; fill: #59636e; }
    .h { font-size: 12.5px; font-weight: 700; fill: #59636e; }
    .bx { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
    .blue { fill: #ddf4ff; stroke: #54aeff; }
    .green { fill: #dafbe1; stroke: #4ac26b; }
    .ar { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .ah { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .s, .n, .h { fill: #9198a1; }
      .bx { fill: #151b23; stroke: #656c76; }
      .blue { fill: #121d2f; stroke: #1f6feb; }
      .green { fill: #12261e; stroke: #2ea043; }
      .ar { stroke: #9198a1; }
      .ah { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>

  <text class="h" x="20" y="30">準備と観測（Android アプリ側）</text>
  <rect class="bx blue" x="20" y="44" width="200" height="96" rx="8"/>
  <text class="n" x="34" y="66">STEP 1</text>
  <text class="t" x="34" y="88">APK の入手</text>
  <text class="s" x="34" y="110">apkeep / adb pull</text>
  <text class="s" x="34" y="128">split APK 一式</text>

  <rect class="bx blue" x="260" y="44" width="200" height="96" rx="8"/>
  <text class="n" x="274" y="66">STEP 2</text>
  <text class="t" x="274" y="88">静的解析</text>
  <text class="s" x="274" y="110">jadx / apktool</text>
  <text class="s" x="274" y="128">API・Protobuf・HMAC 鍵</text>

  <rect class="bx blue" x="500" y="44" width="200" height="96" rx="8"/>
  <text class="n" x="514" y="66">STEP 3</text>
  <text class="t" x="514" y="88">PAIRIP の回避</text>
  <text class="s" x="514" y="110">Application クラスを</text>
  <text class="s" x="514" y="128">本来のものに戻す</text>

  <rect class="bx blue" x="740" y="44" width="220" height="96" rx="8"/>
  <text class="n" x="754" y="66">STEP 4</text>
  <text class="t" x="754" y="88">TLS の中間者化</text>
  <text class="s" x="754" y="110">mitmproxy + CA 差し替え</text>
  <text class="s" x="754" y="128">+ Network Security Config</text>

  <text class="h" x="20" y="200">再実装（Node.js）</text>
  <rect class="bx green" x="20" y="214" width="200" height="96" rx="8"/>
  <text class="n" x="34" y="236">STEP 5</text>
  <text class="t" x="34" y="258">実機でペアリング</text>
  <text class="s" x="34" y="280">エミュレータで通信を記録</text>
  <text class="s" x="34" y="298">証明書と鍵を抽出</text>

  <rect class="bx green" x="260" y="214" width="200" height="96" rx="8"/>
  <text class="n" x="274" y="236">STEP 6</text>
  <text class="t" x="274" y="258">クレデンシャル経路</text>
  <text class="s" x="274" y="280">AWS IoT MQTT で</text>
  <text class="s" x="274" y="298">一時鍵を取得</text>

  <rect class="bx green" x="500" y="214" width="200" height="96" rx="8"/>
  <text class="n" x="514" y="236">STEP 7</text>
  <text class="t" x="514" y="258">WebRTC 視聴</text>
  <text class="s" x="514" y="280">aiortc ✗ → wrtc ✗</text>
  <text class="s" x="514" y="298">→ node-datachannel ✓</text>

  <rect class="bx green" x="740" y="214" width="220" height="96" rx="8"/>
  <text class="n" x="754" y="236">STEP 8</text>
  <text class="t" x="754" y="258">HomeKit 化</text>
  <text class="s" x="754" y="280">HAP-NodeJS + ffmpeg</text>
  <text class="s" x="754" y="298">録画・NAS・増設カメラ</text>

  <line class="ar" x1="220" y1="92" x2="256" y2="92" marker-end="url(#a)"/>
  <line class="ar" x1="460" y1="92" x2="496" y2="92" marker-end="url(#a)"/>
  <line class="ar" x1="700" y1="92" x2="736" y2="92" marker-end="url(#a)"/>
  <path class="ar" d="M850,140 V172 H180 V210" marker-end="url(#a)"/>
  <line class="ar" x1="220" y1="262" x2="256" y2="262" marker-end="url(#a)"/>
  <line class="ar" x1="460" y1="262" x2="496" y2="262" marker-end="url(#a)"/>
  <line class="ar" x1="700" y1="262" x2="736" y2="262" marker-end="url(#a)"/>
</svg>
