<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 200" role="img" aria-labelledby="title desc">
  <title id="title">Protobuf 定義の復元</title>
  <desc id="desc">jadx が出力した Java ソースに埋め込まれた記述子の文字列から、.proto ファイルを復元する流れ。</desc>
  <style>
    text { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f2328; }
    .t { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; fill: #59636e; }
    .m { font-family: ui-monospace, Menlo, monospace; font-size: 11px; fill: #59636e; }
    .bx { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
    .blue { fill: #ddf4ff; stroke: #54aeff; }
    .green { fill: #dafbe1; stroke: #4ac26b; }
    .ar { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .ah { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .s, .m { fill: #9198a1; }
      .bx { fill: #151b23; stroke: #656c76; }
      .blue { fill: #121d2f; stroke: #1f6feb; }
      .green { fill: #12261e; stroke: #2ea043; }
      .ar { stroke: #9198a1; }
      .ah { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>

  <rect class="bx blue" x="20" y="20" width="210" height="120" rx="8"/>
  <text class="t" x="36" y="46">jadx の出力</text>
  <text class="m" x="36" y="70">webrtc_if/WebrtcIf.java</text>
  <text class="m" x="36" y="88">call/Call.java …</text>
  <text class="s" x="36" y="114">protobuf-java の</text>
  <text class="s" x="36" y="130">生成クラス</text>

  <rect class="bx" x="270" y="20" width="210" height="120" rx="8"/>
  <text class="t" x="286" y="46">記述子の文字列</text>
  <text class="m" x="286" y="70">internalBuildGenerated</text>
  <text class="m" x="286" y="88">FileFrom(new String[]{…})</text>
  <text class="s" x="286" y="114">1 文字 = 1 バイト</text>
  <text class="s" x="286" y="130">（エスケープを解く）</text>

  <rect class="bx" x="520" y="20" width="210" height="120" rx="8"/>
  <text class="t" x="536" y="46">FileDescriptorProto</text>
  <text class="s" x="536" y="70">protobufjs の</text>
  <text class="m" x="536" y="88">ext/descriptor</text>
  <text class="s" x="536" y="114">でデコード</text>

  <rect class="bx green" x="770" y="20" width="190" height="120" rx="8"/>
  <text class="t" x="786" y="46">.proto ソース</text>
  <text class="m" x="786" y="70">proto/gen/*.proto</text>
  <text class="s" x="786" y="96">フィールド番号・型・</text>
  <text class="s" x="786" y="114">enum が元と完全一致</text>

  <line class="ar" x1="230" y1="80" x2="266" y2="80" marker-end="url(#a)"/>
  <line class="ar" x1="480" y1="80" x2="516" y2="80" marker-end="url(#a)"/>
  <line class="ar" x1="730" y1="80" x2="766" y2="80" marker-end="url(#a)"/>

  <text class="m" x="20" y="176">node research/extract_proto.js research/jadx-src/sources/webrtc_if/WebrtcIf.java proto/gen</text>
</svg>
