<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">doorphone-hap 全体構成</title>
  <desc id="desc">Raspberry Pi 上の doorphone-hap が、Apple Home・ブラウザ・ドアホン親機・NAS・Panasonic クラウドとどうつながるかを示す構成図。</desc>
  <style>
    text { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f2328; }
    .t { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; fill: #59636e; }
    .m { font-family: ui-monospace, Menlo, monospace; font-size: 11px; fill: #59636e; }
    .lbl { font-size: 11px; fill: #59636e; }
    .frame { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .bx { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
    .blue { fill: #ddf4ff; stroke: #54aeff; }
    .green { fill: #dafbe1; stroke: #4ac26b; }
    .yellow { fill: #fff8c5; stroke: #d4a72c; }
    .red { fill: #ffebe9; stroke: #ff8182; }
    .purple { fill: #fbefff; stroke: #c297ff; }
    .ar { stroke: #59636e; stroke-width: 1.4; fill: none; }
    .ah { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .s, .m, .lbl { fill: #9198a1; }
      .frame { stroke: #656c76; }
      .bx { fill: #151b23; stroke: #656c76; }
      .blue { fill: #121d2f; stroke: #1f6feb; }
      .green { fill: #12261e; stroke: #2ea043; }
      .yellow { fill: #272115; stroke: #9e6a03; }
      .red { fill: #2c1517; stroke: #da3633; }
      .purple { fill: #211830; stroke: #8957e5; }
      .ar { stroke: #9198a1; }
      .ah { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>

  <!-- RPi container -->
  <rect class="frame" x="220" y="20" width="480" height="540" rx="12"/>
  <text class="t" x="238" y="48">Raspberry Pi — doorphone-hap</text>
  <text class="s" x="238" y="68">systemd サービス / Node.js（1 プロセス）</text>

  <!-- Left column (users side) -->
  <rect class="bx blue" x="240" y="100" width="190" height="64" rx="8"/>
  <text class="t" x="254" y="126">HAP カメラ ×N</text>
  <text class="m" x="254" y="148">accessory.js · hap-nodejs</text>

  <rect class="bx blue" x="240" y="190" width="190" height="64" rx="8"/>
  <text class="t" x="254" y="216">StreamingDelegate</text>
  <text class="m" x="254" y="238">streaming.js + ffmpeg</text>

  <rect class="bx purple" x="240" y="280" width="190" height="64" rx="8"/>
  <text class="t" x="254" y="306">Web UI（:8080）</text>
  <text class="m" x="254" y="328">pair-web.js · web/*.vue</text>

  <rect class="bx" x="240" y="370" width="190" height="64" rx="8"/>
  <text class="t" x="254" y="396">設定ローダ / CLI</text>
  <text class="m" x="254" y="418">config.js · bin/</text>

  <rect class="bx yellow" x="240" y="460" width="190" height="64" rx="8"/>
  <text class="t" x="254" y="486">設定・状態ファイル</text>
  <text class="s" x="254" y="508">/etc/doorphone-hap ほか</text>

  <!-- Right column (base side) -->
  <rect class="bx green" x="490" y="100" width="190" height="64" rx="8"/>
  <text class="t" x="504" y="126">DoorphoneSource ×N</text>
  <text class="m" x="504" y="148">doorphone-source.js</text>

  <rect class="bx green" x="490" y="190" width="190" height="64" rx="8"/>
  <text class="t" x="504" y="216">CredsRefresher</text>
  <text class="m" x="504" y="238">creds-refresher.js</text>

  <rect class="bx green" x="490" y="280" width="190" height="64" rx="8"/>
  <text class="t" x="504" y="306">RecordService</text>
  <text class="m" x="504" y="328">records.js · base-rpc.js</text>

  <rect class="bx green" x="490" y="370" width="190" height="64" rx="8"/>
  <text class="t" x="504" y="396">NasSync</text>
  <text class="m" x="504" y="418">nas-sync.js</text>

  <rect class="bx red" x="490" y="460" width="190" height="64" rx="8"/>
  <text class="t" x="504" y="486">ペアリング</text>
  <text class="m" x="504" y="508">pair.js</text>

  <!-- External: left -->
  <rect class="bx blue" x="20" y="100" width="170" height="154" rx="10"/>
  <text class="t" x="36" y="128">Apple Home</text>
  <text class="s" x="36" y="150">iPhone / iPad</text>
  <text class="s" x="36" y="170">Apple TV / HomePod</text>
  <text class="s" x="36" y="190">（ホームハブ）</text>

  <rect class="bx purple" x="20" y="280" width="170" height="64" rx="10"/>
  <text class="t" x="36" y="306">ブラウザ</text>
  <text class="s" x="36" y="328">PC / スマホ</text>

  <!-- External: right -->
  <rect class="bx green" x="800" y="100" width="160" height="244" rx="10"/>
  <text class="t" x="816" y="128">親機 VL-X70AH</text>
  <text class="s" x="816" y="152">玄関子機（最大 3）</text>
  <text class="s" x="816" y="172">増設カメラ（最大 4）</text>
  <text class="s" x="816" y="192">SD カード録画</text>
  <text class="s" x="816" y="224">接続の仲介は AWS、</text>
  <text class="s" x="816" y="244">映像は LAN 内で直結</text>

  <rect class="bx" x="800" y="370" width="160" height="64" rx="10"/>
  <text class="t" x="816" y="396">NAS（SMB）</text>
  <text class="s" x="816" y="418">録画バックアップ</text>

  <rect class="bx red" x="800" y="460" width="160" height="64" rx="10"/>
  <text class="t" x="816" y="486">Panasonic クラウド</text>
  <text class="m" x="816" y="508">/reg/&lt;token&gt;</text>

  <!-- Arrows: left side -->
  <line class="ar" x1="194" y1="132" x2="236" y2="132" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="215" y="124" text-anchor="middle">HAP</text>
  <line class="ar" x1="240" y1="222" x2="194" y2="222" marker-end="url(#a)"/>
  <text class="lbl" x="215" y="214" text-anchor="middle">SRTP</text>
  <line class="ar" x1="194" y1="312" x2="236" y2="312" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="215" y="304" text-anchor="middle">HTTP</text>

  <!-- Arrows: internal -->
  <line class="ar" x1="490" y1="152" x2="434" y2="200" marker-end="url(#a)"/>
  <text class="lbl" x="461" y="182" text-anchor="middle">H264 / PCMU</text>
  <line class="ar" x1="434" y1="312" x2="486" y2="312" marker-end="url(#a)"/>
  <line class="ar" x1="585" y1="344" x2="585" y2="366" marker-end="url(#a)"/>

  <!-- Arrows: right side -->
  <line class="ar" x1="680" y1="132" x2="796" y2="132" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="740" y="124" text-anchor="middle">WebRTC（KVS）</text>
  <line class="ar" x1="680" y1="222" x2="796" y2="222" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="740" y="214" text-anchor="middle">MQTT（AWS IoT）</text>
  <line class="ar" x1="680" y1="312" x2="796" y2="312" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="740" y="304" text-anchor="middle">WebRTC DC</text>
  <line class="ar" x1="680" y1="402" x2="796" y2="402" marker-end="url(#a)"/>
  <text class="lbl" x="740" y="394" text-anchor="middle">smbclient</text>
  <line class="ar" x1="680" y1="492" x2="796" y2="492" marker-end="url(#a)"/>
  <text class="lbl" x="740" y="484" text-anchor="middle">HTTPS + HMAC</text>

  <!-- Legend -->
  <rect class="bx blue" x="220" y="584" width="14" height="14" rx="3"/>
  <text class="s" x="240" y="596">HomeKit 配信</text>
  <rect class="bx green" x="340" y="584" width="14" height="14" rx="3"/>
  <text class="s" x="360" y="596">親機との通信</text>
  <rect class="bx purple" x="460" y="584" width="14" height="14" rx="3"/>
  <text class="s" x="480" y="596">Web UI</text>
  <rect class="bx red" x="550" y="584" width="14" height="14" rx="3"/>
  <text class="s" x="570" y="596">ペアリング（初回のみ）</text>
  <rect class="bx yellow" x="720" y="584" width="14" height="14" rx="3"/>
  <text class="s" x="740" y="596">ファイル</text>
</svg>
