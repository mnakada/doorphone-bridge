<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 290" role="img" aria-labelledby="title desc">
  <title id="title">カメラ切り替え時のセッションの受け渡し</title>
  <desc id="desc">玄関子機を見ている途中でカメラ1 を開くと、玄関子機のセッションを閉じてからカメラ1 が接続する。</desc>
  <style>
    text { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f2328; }
    .t { font-size: 13px; font-weight: 600; }
    .s { font-size: 11.5px; fill: #59636e; }
    .w { font-size: 11.5px; font-weight: 600; fill: #1f2328; }
    .lane { fill: #f6f8fa; }
    .blue { fill: #b6e3ff; }
    .green { fill: #8ddb8c; }
    .conn { fill: #dafbe1; stroke: #4ac26b; stroke-dasharray: 4 3; }
    .grace { fill: #eaeef2; stroke: #8c959f; stroke-dasharray: 4 3; }
    .ev { stroke: #cf222e; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .evt { font-size: 11.5px; font-weight: 600; fill: #cf222e; }
    .axis { stroke: #8c959f; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      text, .w { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .lane { fill: #151b23; }
      .blue { fill: #1f6feb; }
      .green { fill: #2ea043; }
      .conn { fill: #12261e; stroke: #2ea043; }
      .grace { fill: #262c36; stroke: #656c76; }
      .ev { stroke: #f85149; }
      .evt { fill: #f85149; }
      .axis { stroke: #656c76; }
    }
  </style>

  <!-- lanes -->
  <rect class="lane" x="20" y="40" width="940" height="40" rx="6"/>
  <rect class="lane" x="20" y="90" width="940" height="40" rx="6"/>
  <rect class="lane" x="20" y="150" width="940" height="40" rx="6"/>
  <rect class="lane" x="20" y="200" width="940" height="40" rx="6"/>
  <text class="t" x="32" y="65">Home: 玄関子機</text>
  <text class="t" x="32" y="115">Home: カメラ1</text>
  <text class="t" x="32" y="175">source door0</text>
  <text class="t" x="32" y="225">source camera0</text>

  <!-- Home streams -->
  <rect class="blue" x="200" y="48" width="320" height="24" rx="4"/>
  <text class="w" x="212" y="65">ライブ視聴中</text>
  <rect class="blue" x="520" y="98" width="420" height="24" rx="4"/>
  <text class="w" x="532" y="115">ライブ視聴（映像は接続後から）</text>

  <!-- door0 source -->
  <rect class="conn" x="180" y="158" width="40" height="24" rx="4"/>
  <rect class="green" x="220" y="158" width="300" height="24" rx="4"/>
  <text class="w" x="232" y="175">接続中（映像受信）</text>
  <rect class="grace" x="520" y="158" width="40" height="24" rx="4"/>
  <text class="s" x="568" y="175">Request_Disconnect → 切断</text>

  <!-- camera0 source -->
  <rect class="grace" x="520" y="208" width="40" height="24" rx="4"/>
  <rect class="conn" x="560" y="208" width="80" height="24" rx="4"/>
  <rect class="green" x="640" y="208" width="300" height="24" rx="4"/>
  <text class="w" x="652" y="225">接続中（映像受信）</text>
  <text class="s" x="566" y="225">接続処理</text>

  <!-- event -->
  <line class="ev" x1="520" y1="30" x2="520" y2="250"/>
  <text class="evt" x="526" y="24">カメラ1 を開く</text>
  <text class="s" x="20" y="270">① camera0 の acquire() → beforeStart で door0.preempt()　② door0 は 'preempted' を通知し、玄関子機の HomeKit ストリームを強制終了</text>
  <text class="s" x="20" y="286">③ door0 が Request_Disconnect を送って閉じるのを待ってから（約 1 秒）camera0 が KVS シグナリングを開始</text>

  <line class="axis" x1="180" y1="140" x2="940" y2="140"/>
  <text class="s" x="936" y="136" text-anchor="end">時間 →</text>
</svg>
